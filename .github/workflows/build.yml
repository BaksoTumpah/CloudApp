name: Build APK Cloud (release)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - name: Siapkan keystore penanda tangan
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS_S: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS_S: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/cloud.jks"
            echo "KS_PASS=$KS_PASS_S" >> $GITHUB_ENV
            echo "KS_ALIAS=${KS_ALIAS_S:-cloud}" >> $GITHUB_ENV
          else
            echo "::warning::Secrets keystore belum diisi. Memakai keystore sementara; APK tidak bisa menimpa versi lama yang terpasang."
            keytool -genkeypair -keystore "$GITHUB_WORKSPACE/cloud.jks" -alias cloud -keyalg RSA -keysize 2048 -validity 10000 -storepass cloudbuild123 -keypass cloudbuild123 -dname "CN=Cloud"
            echo "KS_PASS=cloudbuild123" >> $GITHUB_ENV
            echo "KS_ALIAS=cloud" >> $GITHUB_ENV
          fi
          echo "KS_FILE=$GITHUB_WORKSPACE/cloud.jks" >> $GITHUB_ENV
      - run: python3 patch.py
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Ganti nama jadi release.apk
        run: |
          ls android/app/build/outputs/apk/release/
          cp android/app/build/outputs/apk/release/app-release.apk release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Cloud-APK-release
          path: release.apk
